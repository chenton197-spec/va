# run_fr_robot 部署：a2a noise + gaussian_2std，s256 prefix_speedup @ step 30688

# 策略 checkpoint；相对路径相对于 ct/va/
checkpoint: outputs/a2a_noise_shine_shoes_gaussian_2std_s256_prefix_speedup_260805183230/checkpoint_final_40e.pt

# 训练配置 YAML（与训练一致）；相对路径相对于 ct/va/
# 不设或 null 时回退到 checkpoint 内嵌 config
config: null

# teleop 部署 YAML：FR3 IP、Orbbec、Gloria-M
teleop_yaml: /home/casbot/teleop_project/teleop.yaml

# 覆盖 teleop.yaml 中的 fr3.robot_ip；null 表示不覆盖
robot_ip: null

# MoveJ 回起点速度百分比 [0~100]
vel: 20.0

# 工具号 / 工件号；null 表示使用机器人当前值
tool: null
user: null

# 闭环最大步数
max_steps: 1200

# 启动时 MoveJ 目标（关节角单位：度）
start_pose:
  joints_deg:
    - -47.7424
    - -91.6757
    - -91.555
    - -88.2289
    - 88.7578
    - 42.1355
  tcp_pose:
    - 528.8538
    - -449.481
    - 300.7279
    - 2.2341
    - -0.6568
    - 151.0478

z_limit: -69.5

# Gloria-M MIT 后台刷帧频率（Hz）；与遥操默认 125 对齐
gripper_rate_hz: 125

# 关节角最大速度（度/秒）；chunk 衔接与样条限速共用
max_joint_vel_deg_s: 3

# 相邻稀疏路点单轴最大跳变（度）；超过则按比例截断 Δq
# 默认约 vel×0.1s；设 null 则用 vel×(1/fps)
max_joint_step_deg: 4

# torch.compile encoder + unet/flow_net；默认关闭（RTC grad 路径需台上验证）
compile: false

# RTC 覆盖（可选）；字段为 null 或不写则沿用训练 YAML 的 policy.rtc
rtc:
  enabled: true
  guidance_enabled: true
  inference_delay: 1
  execution_horizon: 12
