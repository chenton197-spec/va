# run_w2/run.py 部署配置（HCX 双臂；脚本仅支持 --deploy）
# FM ResNet18 + 整段 state dropout 50% 100e：
# fm_openarm_hcx_dual_arm_merged_resnet18_wholestate_100e_260819003821

# 策略 checkpoint；相对路径相对于 ct/va/
checkpoint: model/fm_openarm_hcx_dual_arm_merged_resnet18_wholestate_100e_260819003821/checkpoint_best_val.pt
# 训练配置可选；不设或 null 时回退到 checkpoint 内嵌 config
config: model/fm_openarm_hcx_dual_arm_merged_resnet18_wholestate_100e_260819003821/config.yaml

# teleop 部署 YAML（HCX、Orbbec、Gloria-M）；相对路径相对于 ct/va/
# 相机从 teleop.yaml 的 hcx_orbbec 段读取（head/left_hand/right_hand），不是 orbbec 段
teleop_yaml: teleop_project/teleop.yaml

# 闭环最大步数
max_steps: 5000

# 观测采样频率（Hz）：后台抓图像+状态的节奏
# null / 省略：等于训练 config 的 fps（该模型为 15）
obs_fps: 10

# 每次推理后执行几步再 replan（仅切片，不改模型结构）
# null / 省略：等于 checkpoint 的 policy.n_action_steps（该模型为 32）
# 只能缩短（更频繁 replan），不能大于 n_action_steps
# rtc.enabled=true 时忽略此项，改用 rtc.execution_horizon
exec_action_steps: 7

# RTC 覆盖（可选）；字段为 null 或不写则沿用训练 YAML 的 policy.rtc
# 训练 config 里 rtc.enabled=false；此处打开：执行 execution_horizon 步就 replan
# 15fps 下 exec_h=8 ≈ 1.9Hz 推理（原先 15 约为 1Hz）
rtc:
  enabled: false
  guidance_enabled: true
  inference_delay: 2
  execution_horizon: 8

# 启动时 HCX 左右臂可选起始位（关节角单位：度，7轴）
# 取自 datasets/to_init episode_000000 末几帧 observation.state（已稳定，帧间差为 0）
# 可设为 null 跳过起始位动作 / 夹爪渐变。
start_pose:
  left_joints_deg: [73.472, -99.825, -68.715, -113.846, -8.094, 49.670, 18.022]
  right_joints_deg: [-53.615, -26.528, 24.762, -99.165, 8.271, -11.516, 28.923]
  left_gripper: 0.902
  right_gripper: 1.0
  gripper_ramp_s: 0.9

# 左右臂共用 7 轴限位（度）；闭环与起始位下发前 clip
joint_limits_deg:
  min: [-169.0, -100.0, -169.0, -139.0, -169.0, -54.0, -59.0]
  max: [169.0, 100.0, 169.0, 54.0, 169.0, 54.0, 59.0]

# HCX move_joints 规划参数
move_joints:
  speed_ratio: 0.5
  acceleration_seconds: 0.3
  deceleration_seconds: 0.3
  feedback_confirm_timeout_s: 30.0
  feedback_confirm_poll_interval_s: 0.05
  angle_tolerance_deg: 0.8
  # 相对当前反馈，每轴每步最大关节角变化量（度）
  max_delta_deg: 12.0

# 夹爪频率由 teleop.yaml 的 gloria_m_dual.rate_hz 统一控制
