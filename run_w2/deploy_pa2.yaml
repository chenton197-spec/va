# run_w2/run.py 部署配置（HCX 双臂；脚本仅支持 --deploy）
# PA2 gaussian_2std：a2a_noise_openarm_hcx_dual_arm_pa2_gaussian_2std_260814173958

# 策略 checkpoint；相对路径相对于 ct/va/
checkpoint: model/a2a_noise_openarm_hcx_dual_arm_pa2_gaussian_2std_260814173958/checkpoint_1164720.pt
# 训练配置可选；不设或 null 时回退到 checkpoint 内嵌 config
# config: outputs/a2a_noise_openarm_hcx_dual_arm_pa2_gaussian_2std_260814173958/config.yaml

# teleop 部署 YAML（HCX、Orbbec、Gloria-M）；相对路径相对于 ct/va/
# 相机从 teleop.yaml 的 hcx_orbbec 段读取（head/left_hand/right_hand），不是 orbbec 段
teleop_yaml: teleop_project/teleop.yaml

# 闭环最大步数
max_steps: 5000

# 每次推理后执行几步再 replan（仅切片，不改模型结构）
# null / 省略：等于 checkpoint 的 policy.n_action_steps（该模型为 32）
# 只能缩短（更频繁 replan），不能大于 n_action_steps
exec_action_steps: 16

# 启动时 HCX 左右臂可选起始位（关节角单位：度，7轴）
# 取自 openarm_hcx_dual_arm episode_000300 第一帧 observation.state
# 可设为 null 跳过起始位动作 / 夹爪渐变。
start_pose:
  left_joints_deg: [73.472, -99.825, -68.715, -113.846, -8.094, 49.670, 18.022]
  right_joints_deg: [-53.615, -26.528, 24.762, -99.165, 8.271, -11.516, 28.923]
  # left_joints_deg: null
  # right_joints_deg: null
  # 归一化开口 [0,1]；启动时从当前开口线性插值到目标
  left_gripper: 0.902
  right_gripper: 1.0
  gripper_ramp_s: 1.0

# 左右臂共用 7 轴限位（度）；闭环与起始位下发前 clip
joint_limits_deg:
  min: [-169.0, -100.0, -169.0, -139.0, -169.0, -54.0, -59.0]
  max: [169.0, 100.0, 169.0, 54.0, 169.0, 54.0, 59.0]

# HCX move_joints 规划参数
move_joints:
  speed_ratio: 0.1
  acceleration_seconds: 0.3
  deceleration_seconds: 0.3
  feedback_confirm_timeout_s: 30.0
  feedback_confirm_poll_interval_s: 0.05
  angle_tolerance_deg: 0.01
  # 相对当前反馈，每轴每步最大关节角变化量（度）
  max_delta_deg: 10.0

# 夹爪频率由 teleop.yaml 的 gloria_m_dual.rate_hz 统一控制
