# run_w2/run.py 部署配置（HCX 双臂；脚本仅支持 --deploy）

# 策略 checkpoint；相对路径相对于 ct/va/
# sepenc gaussian_2std：a2a_noise_openarm_hcx_dual_arm_sepenc_gaussian_2std_260815170822
checkpoint: outputs/a2a_noise_openarm_hcx_dual_arm_sepenc_gaussian_2std_260815170822/checkpoint_final.pt
# 训练配置可选；不设或 null 时回退到 checkpoint 内嵌 config
config: outputs/a2a_noise_openarm_hcx_dual_arm_sepenc_gaussian_2std_260815170822/config.yaml

# teleop 部署 YAML（HCX、Orbbec、Gloria-M）
# 相机从 teleop.yaml 的 hcx_orbbec 段读取（head/left_hand/right_hand），不是 orbbec 段
teleop_yaml: /home/a/Code/teleop_project/teleop.yaml

# 闭环最大步数
max_steps: 5000

# 观测采样频率（Hz）：后台抓图像+状态的节奏
# null / 省略：等于训练 config 的 fps
# 改大/改小会改变 n_obs_steps 帧覆盖的时间跨度，与训练时间窗不一致
obs_fps: 10

# 每次推理后执行几步再 replan（仅切片，不改模型结构）
# null / 省略：等于 checkpoint 的 policy.n_action_steps
# 只能缩短（更频繁 replan），不能大于 n_action_steps
# rtc.enabled=true 时忽略此项，改用 rtc.execution_horizon
exec_action_steps: 15

# RTC 覆盖（可选）；字段为 null 或不写则沿用训练 YAML 的 policy.rtc
# enabled 后：执行 execution_horizon 步就 replan，用未执行 leftover 约束新 chunk 前缀
rtc:
  enabled: false
  guidance_enabled: false
  inference_delay: 2
  execution_horizon: 15

# 启动时 HCX 左右臂可选起始位（关节角单位：度，7轴）
# 取自 datasets/to_init episode_000000 末几帧 observation.state（已稳定，帧间差为 0）
# 可设为 null 跳过起始位动作 / 夹爪渐变。
start_pose: 
  left_joints_deg: [91.758, -74.176, -98.527, -101.011, -23.560, 11.429, 6.945]
  right_joints_deg: [-34.791, -37.604, 1.121, -92.044, 4.659, -15.209, 14.242]
  # # left_joints_deg: null
  # # right_joints_deg: null
  # # 归一化开口 [0,1]；启动时从当前开口线性插值到目标
  left_gripper: 0.998
  right_gripper: 1.0
  gripper_ramp_s: 0.9

# 左右臂共用 7 轴限位（度）；闭环与起始位下发前 clip
joint_limits_deg:
  min: [-169.0, -100.0, -169.0, -139.0, -169.0, -54.0, -59.0]
  max: [169.0, 100.0, 169.0, 54.0, 169.0, 54.0, 59.0]

# HCX move_joints 规划参数
move_joints:
  speed_ratio: 0.1
  acceleration_seconds: 0.3
  deceleration_seconds: 0.3
  feedback_confirm_timeout_s: 30.0
  feedback_confirm_poll_interval_s: 0.05
  angle_tolerance_deg: 0.02
  # 相对当前反馈，每轴每步最大关节角变化量（度）
  max_delta_deg: 12.0

# 夹爪频率由 teleop.yaml 的 gloria_m_dual.rate_hz 统一控制
