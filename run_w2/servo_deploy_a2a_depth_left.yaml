# run_w2/servo_deploy.py 伺服部署配置（HCX 左臂 8-D）
# 与 deploy_a2a_depth_left.yaml（move_joints 规划模式）不同：
# 本配置由 servo_deploy.py 使用：15Hz 推理 → 100Hz 源点下发（teleop.rate_hz）
# → SDK HcxDirectServoConfig linear/limited 插值 → 500Hz 原生 PluseToServo
# （对齐 run_left_arm_depth_direct_threaded.py，不在 Python 里硬打 500Hz）
# A2A ResNet18 + 深度数据集左臂：head/left_hand，state/action = L0–L6 + left_gripper
# a2a_noise_openarm_hcx_dual_arm_with_depth_left_260819212600

# 策略 checkpoint；相对路径相对于 ct/va/
checkpoint: outputs/a2a_noise_openarm_hcx_dual_arm_with_depth_left_260819212600/checkpoint_best_val.pt
# 训练配置可选；不设或 null 时回退到 checkpoint 内嵌 config
config: outputs/a2a_noise_openarm_hcx_dual_arm_with_depth_left_260819212600/config.yaml

# teleop 部署 YAML（HCX、Orbbec、Gloria-M）；相对路径相对于 ct/va/
teleop_yaml: teleop_project/teleop.yaml

# 观测模式：fps = 后台按训练 fps（cfg.fps=15）采图
# （servo_deploy.py 固定使用训练 config 的 fps 做推理节拍，忽略 deploy 的 obs_fps）
obs_mode: fps

# 运行时弹出 OpenCV 窗口显示训练用相机（本模型为 head + left_hand）
display_cameras: false

# 闭环最大推理步数
max_steps: 50000

# RTC 与伺服模式每步重规划冲突，servo_deploy.py 会强制关闭 policy.rtc，
# 无需在此配置；此处仅作记录
rtc:
  enabled: false

# 伺服段（servo_deploy.py 独有，_load_deploy_config 会丢弃未知键，
# 由脚本直接从本 yaml 读取）：
# 100Hz 源点频率来自 teleop.yaml 的 teleop.rate_hz；
# 500Hz 输出频率来自 teleop.yaml 的 hcx.direct_servo_rate_hz（须为 500，
# 且 interpolation 为 limited/linear，500 % rate_hz == 0）。
servo:
  # SDK 输出频率校验；必须与 teleop.yaml hcx.direct_servo_rate_hz 同为 500
  rate_hz: 500
  # 推理看门狗（s）：主线程超过该时长未提交新 chunk 时，
  # 100Hz 下发线程保持最后目标（SDK 500Hz 线程继续消费批次）
  watchdog_s: 0.5
  # 100Hz 源点一阶平滑时间常数（秒）；0 表示不平滑（限速仍生效）
  command_filter_tau_s: 0
  # 100Hz 每拍限速（deg/s），与上面滤波独立
  max_joint_vel_deg_s: 90.0
  # SDK 1s 窗口 observed_rate_hz 低于该值则停机
  servo_fault_hz_warn: 450.0

# 启动时 HCX 左臂可选起始位（关节角单位：度，7轴）
# 左臂取自 data/openarm_hcx_dual_arm_with_depth episode_000007 第一帧
# 起始位用 move_joints 规划模式到位（安全），到位后再进入伺服闭环
start_pose:
  # left_joints_deg: [105.848, -64.945, -131.184, -112.439, -34.477, 15.385, -16.704]
  left_joints_deg: null
  right_joints_deg: null
  left_gripper: 0.923
  right_gripper: 1.0
  gripper_ramp_s: 0.9

# 左右臂共用 7 轴限位（度）；伺服线程每周期 clamp 目标
joint_limits_deg:
  min: [-169.0, -100.0, -169.0, -139.0, -169.0, -54.0, -59.0]
  max: [169.0, 100.0, 169.0, 54.0, 169.0, 54.0, 59.0]

# HCX move_joints 规划参数：仅用于起始位到位，不进伺服循环
move_joints:
  speed_ratio: 1.0
  acceleration_seconds: 0.1
  deceleration_seconds: 0.1
  feedback_confirm_timeout_s: 30.0
  feedback_confirm_poll_interval_s: 0.05
  angle_tolerance_deg: 0.2
  feedback_confirm: true
  interrupt: false
  max_delta_deg: 12.0

# 夹爪频率由 teleop.yaml 的 gloria_m_dual.rate_hz 统一控制
