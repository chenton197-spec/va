# 基于 openarm_hcx_dual_arm_a2a_noise_sepenc.yaml
# 差异：horizon/n_action_steps=32；resize=256；predict_joint_delta=true；
#       enc_contrastive_weight=5e-4（视觉/状态 latent ↔ 动作 latent InfoNCE）
# 离线 BC：A2A+noise + gaussian_2std（(x-mean)/(2*std)），无 OT
# 硬件（本机实测）：RTX 5060 Ti 16GB（16311 MiB；桌面约占 ~0.4GB）
#   + i5-13500 (14C/20T) + 31GB RAM
# 数据：openarm_hcx_dual_arm_merged（双臂 14 关节 + L/R gripper → 16-D；三相机）
# N=99262（411 ep；两库合并后抽 10 ep 验证集）
# → floor(N/80)=1240 steps/epoch → 50 epoch = 62000
# 图像：1280×720 中心裁 720×720 → resize 256×256（保比例）；horizon=32
# 加速：uint8 盘缓存跳过 JPEG + GPU color_jitter + torch.compile
# 本机吞吐 2026-08-17（fp32, uint8_cache 256, h32, workers=2）：
#   bs48 73.8 samp/s 6.4GB；bs72 73.4 / 9.4GB；bs80 74.0 / 10.3GB ←
#   compile bs72 75.3 / 8.7GB；compile bs80 75.2 / 9.5GB（并列最快，取 bs80）
#   bs88 73.5 / 11.3GB；更大 batch 不再涨吞吐
# 三相机独立 ResNet 权重（share_image_encoder=false）
# 注意：train.amp 已知 bug，训练中途易 loss=nan，保持 amp=false
# 编号 ckpt 每 5 epoch：save_freq = 5 * 1240 = 6200
# latest 每 1 epoch：latest_save_freq = 1240
# 训练中验证：openarm_hcx_dual_arm_val（10 ep）；val_freq=2480（每 2 epoch）
#   开环物理 MAE（无 jitter / dropout / history noise）；最优 mae_joints 存 checkpoint_best_val.pt
# 状态遮挡：逼模型用图像。关节组 / 夹爪组独立整组置零（obs_state + A2A obs_history
#   共用同一 mask）。勿开 camera_dropout（相机会逼模型更抄关节）。
#   后期故意保持较高 drop，避免 cosine 尾段把视觉依赖训掉；两组全灭时随机放回一组
cameras: [head, left_hand, right_hand]
state_dim: 16
action_dim: 16
state_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
action_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
fps: 15
data_root: data
output_dir: outputs/a2a_noise_openarm_hcx_dual_arm_merged_sepenc_statedrop_h32_s256_gaussian_2std

dataset:
  n_obs_steps: 8
  horizon: 32
  run_name: openarm_hcx_dual_arm_merged
  val_run_name: openarm_hcx_dual_arm_val  # 10 ep holdout；训练中开环 MAE
  pre_crop_size: 720
  resize_size: 256
  crop_size: null
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  # gaussian | gaussian_2std | limits([-1,1]) | limits_01([0,1])
  norm_mode: gaussian_2std
  uint8_cache: true
  gpu_augment: true
  state_dropout:
    enabled: true
    keep_at_least_one: true
    # 与 train.steps 对齐
    schedule_steps: 31000
    early_frac: 0.30
    mid_frac: 0.40
    joint_early_prob: 0.250
    joint_mid_prob: 0.40
    joint_late_prob: 0.50
    gripper_early_prob: 0.25
    gripper_mid_prob: 0.40
    gripper_late_prob: 0.50

policy:
  type: a2a
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 32
  pretrained_encoder: true
  use_frame_diff: true
  # false: head / left_hand / right_hand 各一套 ResNet 权重（约 3× 视觉参数）
  share_image_encoder: false
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  # CLIP 式 InfoNCE：obs_latents（图+状态）↔ GT 动作 latent；5e-4 略高于 VITA 默认 1e-4
  enc_contrastive_weight: 0.0005
  history_noise_std: 0.15
  # 关节增量 Δq=action−q_now（夹爪仍绝对）；flow 历史同样相对 q_now；须从头训
  predict_joint_delta: true
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    # RTC 推理引导（训练不受影响）；A2A 要求 n_action_steps == horizon
    enabled: false
    execution_horizon: 8
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  # 50ep；bs=80 + workers=2 + compile（本机最快；勿 workers≥6）
  batch_size: 80
  steps: 31000
  lr: 0.0001
  weight_decay: 0.00005
  log_freq: 50
  save_freq: 6200            # 编号 ckpt：每 5 epoch
  latest_save_freq: 1240     # latest：每 1 epoch 覆盖
  val_freq: 2480             # 验证集开环 MAE：每 2 epoch
  keep_last_ckpts: 10        # 每份 ~460MB；只留最近 10 个编号 ckpt
  device: cuda
  num_workers: 2
  cosine_lr: true
  warmup_steps: 1000
  encoder_lr_scale: 0.1      # ResNet lr = 1e-5，保护预训练视觉特征不被破坏
  max_grad_norm: 1.0
  amp: false  # 已知 bug：amp 训练易 nan
  compile: true
