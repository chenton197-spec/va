# 离线 BC：A2A+noise + gaussian_2std + ViT-B/16 相机编码器
# 数据：openarm_hcx_dual_arm（双臂 14 关节 + L/R gripper → 16-D；三相机）
# N=32497 → floor(N/16)=2031 steps/epoch → 40 epoch = 81240
# 图像：720 中心裁 → resize 512；编码器内再缩放到 224 匹配 ImageNet ViT
# 视觉：torchvision ViT-B/16 ImageNet-1k 预训练微调；三相机共享权重（约 86M）
cameras: [head, left_hand, right_hand]
state_dim: 16
action_dim: 16
state_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
action_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
fps: 15
data_root: data
output_dir: outputs/a2a_noise_openarm_hcx_dual_arm_vit_gaussian_2std

dataset:
  n_obs_steps: 8
  horizon: 32
  run_name: openarm_hcx_dual_arm
  pre_crop_size: 720
  resize_size: 512
  crop_size: null
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  norm_mode: gaussian_2std
  uint8_cache: true
  gpu_augment: true

policy:
  type: a2a
  vision_backbone: vit_b_16
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 32
  pretrained_encoder: true
  use_frame_diff: true
  # ViT-B 约 86M；共享权重，避免 sepenc 三份显存
  share_image_encoder: true
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  history_noise_std: 0.15
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    enabled: false
    execution_horizon: 8
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  batch_size: 16
  steps: 81240
  lr: 0.0005
  weight_decay: 0.000001
  log_freq: 50
  save_freq: 4062
  device: cuda
  num_workers: 1
  cosine_lr: true
  warmup_steps: 500
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
