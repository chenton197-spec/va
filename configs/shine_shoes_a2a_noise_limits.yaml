# 离线 BC：A2A+noise + limits([-1,1])，无 OT
# 硬件：RTX 5060 8GB（桌面约占 ~0.9GB，训练可用 ~7GB）+ i5-13500 (14C/20T) + 31GB RAM
# 数据：shine_shoes_fr3_s256_prefix_speedup（JPEG 已预缩到 256×256，训练时再 crop 到 224）
# N=105232（drop_n_last_frames=0，与 horizon 无关）→ floor(N/16)=6577 steps/epoch → 20 epoch = 131540
# 加速：uint8 盘缓存跳过 JPEG + GPU 上 crop/color_jitter（先 build_uint8_image_cache.py）
# chunk≈0.8s @30Hz；history_noise 略加强以利于状态扰动下纠错
cameras: [hand, head]
state_dim: 7
action_dim: 7
data_root: /home/casbot/ct/data
output_dir: outputs/a2a_noise_shine_shoes_limits_s256_prefix_speedup

dataset:
  n_obs_steps: 8
  horizon: 24
  run_name: shine_shoes_fr3_s256_prefix_speedup
  resize_size: 256
  crop_size: 224
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  norm_mode: limits
  uint8_cache: true
  gpu_augment: true

policy:
  type: a2a
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 24
  pretrained_encoder: true
  use_frame_diff: true
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  history_noise_std: 0.15
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    # RTC 推理引导（训练不受影响）；A2A 要求 n_action_steps == horizon
    enabled: false
    execution_horizon: 8
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  # 8GB 显存 + 桌面占用：bs=16 已在同卡 horizon=32 跑通；勿盲目加到 20+
  # uint8 cache 后 worker 主要做 memmap→float；4 够用，省 RAM 给未裁剪 256 图传输
  batch_size: 16
  steps: 131540
  lr: 0.0003
  weight_decay: 0.000001
  log_freq: 50
  save_freq: 6600
  device: cuda
  num_workers: 4
  cosine_lr: true
  warmup_steps: 1000
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
