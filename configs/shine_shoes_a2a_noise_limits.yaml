# 离线 BC：A2A+noise + limits([-1,1])，无 OT
# 硬件：RTX 5060 8GB + i5-13500 (14C/20T) + 31GB RAM
# 数据：shine_shoes_fr3_s256（JPEG 已预缩到 256×256，训练时再 crop 到 224）
# N=132645 → floor(N/16)=8290 steps/epoch → 50 epoch = 414500
cameras: [hand, head]
state_dim: 7
action_dim: 7
data_root: /home/casbot/ct/data
output_dir: outputs/a2a_noise_shine_shoes_limits_s256

dataset:
  n_obs_steps: 8
  horizon: 8
  run_name: shine_shoes_fr3_s256
  resize_size: 256
  crop_size: 224
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  norm_mode: limits

policy:
  type: a2a
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 8
  pretrained_encoder: true
  use_frame_diff: true
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  history_noise_std: 0.1
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    # RTC 推理（训练不受影响）；A2A 要求 n_action_steps == horizon
    # guidance_enabled=false → 仅 ActionQueue ahead+discard，不做前缀引导
    enabled: false
    guidance_enabled: true
    execution_horizon: 4
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  # 8GB 显存保持 bs=16；s256 预缩放后 decode 更轻，workers=6 通常够用
  batch_size: 16
  steps: 414500
  lr: 0.0003
  weight_decay: 0.000001
  log_freq: 50
  save_freq: 20000
  device: cuda
  num_workers: 6
  cosine_lr: true
  warmup_steps: 2000
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
