backend: real_robot
embodiment: fairino_fr3
cameras: [hand, head]
state_dim: 7
action_dim: 7
state_names: [j1, j2, j3, j4, j5, j6, gripper]
action_names: [j1, j2, j3, j4, j5, j6, gripper]
fps: 30
data_root: /home/casbot/teleop_project/datasets
output_dir: outputs/fm_shine_shoes

env:
  render_size: 720
  max_episode_steps: 1000
  render_mode: rgb_array

dataset:
  n_obs_steps: 2
  horizon: 8
  run_name: shine_shoes_fr3
  resize_size: 256
  crop_size: 224
  eval_fixed_crop: true
  norm_mode: gaussian

policy:
  type: flow_matching
  hidden_dim: 256
  num_inference_steps: 10
  n_action_steps: 6
  beta_alpha: 1.5
  beta_beta: 1.0
  noise_s: 0.999
  pretrained_encoder: true
  use_frame_diff: true
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8
  rtc:
    enabled: false
    execution_horizon: 4
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  batch_size: 16
  steps: 50000
  lr: 0.0003
  weight_decay: 0.000001
  log_freq: 100
  save_freq: 5000
  device: cuda
  num_workers: 2
  cosine_lr: true
  warmup_steps: 500
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0

eval:
  num_episodes: 10
  save_video: false
  video_dir: outputs/eval_videos

collect:
  target_episodes: 30
  save_all: false
  task: shine shoes
