# 离线 BC：A2A+noise + gaussian_2std（(x-mean)/(2*std)），无 OT
# 硬件：RTX 5060 Ti 16GB（桌面约占 ~0.6GB）+ i5-12400F (6C/12T) + 15GB RAM
# 数据：shine_shoes_fr3_s256_prefix_speedup（JPEG 已预缩到 256×256，训练时再 crop 到 224）
# N=105232（drop_n_last_frames=0，与 horizon 无关）
# → floor(N/48)=2192 steps/epoch → 40 epoch = 87680
# 加速：uint8 盘缓存跳过 JPEG + GPU 上 crop/color_jitter（先 build_uint8_image_cache.py）
# 吞吐：VRAM 充裕；15GB RAM+swap 会被 DataLoader 打满 → bs=48 + workers=1
# chunk≈0.8s @30Hz；history_noise 略加强以利于状态扰动下纠错
cameras: [hand, head]
state_dim: 7
action_dim: 7
data_root: .
output_dir: outputs/a2a_noise_shine_shoes_gaussian_2std_s256_prefix_speedup

dataset:
  n_obs_steps: 8
  horizon: 24
  run_name: shine_shoes_fr3_s256_prefix_speedup
  resize_size: 256
  crop_size: 224
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  # gaussian | gaussian_2std | limits([-1,1]) | limits_01([0,1])
  norm_mode: gaussian_2std
  uint8_cache: true
  gpu_augment: true

policy:
  type: a2a
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 24
  pretrained_encoder: true
  use_frame_diff: true
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  history_noise_std: 0.15
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    # RTC 推理引导（训练不受影响）；A2A 要求 n_action_steps == horizon
    enabled: false
    execution_horizon: 8
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  # 16GB VRAM 充裕；15GB RAM 是瓶颈 → bs=48 + workers=1（workers≥2 易打满 swap）
  # 相对旧 bs=16 略抬 lr；每 2 epoch 存盘
  batch_size: 48
  steps: 87680
  lr: 0.0005
  weight_decay: 0.000001
  log_freq: 50
  save_freq: 4384
  device: cuda
  num_workers: 1
  cosine_lr: true
  warmup_steps: 500
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
