cameras: [head, left_hand, right_hand]
state_dim: 16
action_dim: 16
state_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
action_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
fps: 15
data_root: data
output_dir: outputs/fm_openarm_hcx_dual_arm_with_out_room_s_depth_nobs1_h80

dataset:
  n_obs_steps: 1
  horizon: 80
  run_name: openarm_hcx_dual_arm_with_out_room_s_15fps
  image_size: [256, 341]
  norm_mode: gaussian_2std
  color_jitter_brightness: 0.1
  color_jitter_contrast: 0.1
  color_jitter_saturation: 0.0
  color_jitter_hue: 0.0
  uint8_cache: true
  gpu_augment: true
  depth_cameras: [left_hand, right_hand]
  depth_min_mm: 50.0
  depth_max_mm: 500.0
  val_ratio: 0.05
  split_seed: 42

policy:
  type: flow_matching
  vision_backbone: resnet18
  hidden_dim: 256
  num_inference_steps: 10
  n_action_steps: 80
  pretrained_encoder: true
  use_frame_diff: false
  share_image_encoder: false
  arm_aware: true
  split_arm_unet: true
  predict_joint_delta: true
  token_grid: 8
  use_temporal_attn: true
  use_cross_attn: true
  down_dims: [128, 256, 512]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8
  beta_alpha: 1.5
  beta_beta: 1.0
  noise_s: 0.999
  rtc:
    enabled: false

train:
  batch_size: 32
  steps: 418760
  lr: 0.0001
  weight_decay: 0.000001
  log_freq: 50
  save_freq: 10469
  latest_save_freq: 10469
  keep_last_ckpts: 40
  device: cuda
  num_workers: 4
  cosine_lr: true
  warmup_steps: 1000
  encoder_lr_scale: 0.5
  proprio_lr_scale: 0.05
  ema_decay: 0.999
  arm_segment_drop_prob: 0.5
  max_grad_norm: 1.0
  amp: false
  compile: true
  val_freq: 10469
  val_samples: 64
