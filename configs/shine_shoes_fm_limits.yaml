backend: real_robot
embodiment: fairino_fr3
cameras: [hand, head]
state_dim: 7
action_dim: 7
state_names: [j1, j2, j3, j4, j5, j6, gripper]
action_names: [j1, j2, j3, j4, j5, j6, gripper]
fps: 30
data_root: /home/casbot/teleop_project/datasets
# FM + limits([-1,1])，RTX 5060 8GB / dual-cam 实测推荐
output_dir: outputs/fm_shine_shoes_limits

dataset:
  n_obs_steps: 2
  horizon: 8
  run_name: shine_shoes_fr3
  resize_size: 256
  crop_size: 224
  eval_fixed_crop: true
  # 训练光度增强（评估不加）；0=关闭。同一样本共用一组随机因子。
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  # gaussian | limits([-1,1]) | limits_01([0,1])
  norm_mode: limits

policy:
  type: flow_matching
  hidden_dim: 256
  num_inference_steps: 10
  n_action_steps: 6
  beta_alpha: 1.5
  beta_beta: 1.0
  noise_s: 0.999
  pretrained_encoder: true
  use_frame_diff: true
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8

train:
  # 瓶颈在双相机 JPEG decode，不是显存。bs=16 + workers=6 是速度/样本量折中。
  # 显存上限约 bs=112；更大 batch 每 step 更慢，200k 墙钟更长。
  batch_size: 16
  steps: 200000
  lr: 0.0003
  weight_decay: 0.000001
  log_freq: 100
  save_freq: 10000
  device: cuda
  num_workers: 6
  cosine_lr: true
  warmup_steps: 1000
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
