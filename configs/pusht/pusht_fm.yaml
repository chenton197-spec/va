backend: pusht
embodiment: pusht_sim
cameras: [top]
state_dim: 2
action_dim: 2
state_names: [x, y]
action_names: [x, y]
fps: 30
data_root: data/demos
# ImageNet 预训练视觉 + frame diff + UNet FM
output_dir: outputs/fm_pusht_pretrained

env:
  render_size: 96
  max_episode_steps: 1000
  render_mode: human

dataset:
  n_obs_steps: 2
  horizon: 8
  run_name: pusht_demos_merged_2607211809_1829
  crop_size: 84
  eval_fixed_crop: true
  norm_mode: gaussian

policy:
  type: flow_matching
  hidden_dim: 256
  num_inference_steps: 10
  n_action_steps: 6
  beta_alpha: 1.5
  beta_beta: 1.0
  noise_s: 0.999
  pretrained_encoder: true
  use_frame_diff: true
  down_dims: [256, 512, 1024]
  diffusion_step_embed_dim: 256
  kernel_size: 5
  n_groups: 8
  # RTC 推理引导（训练不受影响）；启用时建议 n_action_steps < horizon，且 inference_delay < horizon
  rtc:
    enabled: false
    execution_horizon: 4
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  batch_size: 256
  steps: 50000
  lr: 0.0003
  weight_decay: 0.000001
  log_freq: 100
  save_freq: 5000
  device: cuda
  num_workers: 2
  cosine_lr: true
  warmup_steps: 500
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0

eval:
  num_episodes: 50
  save_video: false
  video_dir: outputs/eval_videos

collect:
  target_episodes: 30
  save_all: false
  task: push the T block to the target
