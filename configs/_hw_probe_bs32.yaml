# 离线 BC：A2A+noise + gaussian_2std（(x-mean)/(2*std)），无 OT
# 硬件（本机实测）：RTX 5060 Ti 16GB（16311 MiB；桌面约占 ~0.4GB）
#   + i5-13500 (14C/20T) + 31GB RAM
# 数据：openarm_hcx_dual_arm（双臂 14 关节 + L/R gripper → 16-D；三相机）
# N=98737（drop_n_last_frames=0；缺 5 ep 后实测）
# → floor(N/16)=6171 steps/epoch → 40 epoch = 246840
# 图像：1280×720 中心裁 720×720 → resize 512×512（保比例）；horizon=16
# 加速：uint8 盘缓存跳过 JPEG + GPU color_jitter（先 build_uint8_image_cache.py
#   --pre-crop-size 720 --resize-size 512）
# 三相机独立 ResNet 权重（share_image_encoder=false）
# 吞吐：16GB 上 512+sepenc → bs=16（8GB 时 bs=16 会 OOM；bs=8≈6.3GB）
#   三相机串行 ResNet 下再加大 bs 对 samp/s 帮助有限，但能减半 steps
#   → workers=2（31GB RAM 够用；workers=4 易抢 217G 缓存页缓存）
# 每 4 epoch 存盘：save_freq = 4 * 6171 = 24684
cameras: [head, left_hand, right_hand]
state_dim: 16
action_dim: 16
state_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
action_names:
  [L0, L1, L2, L3, L4, L5, L6, R0, R1, R2, R3, R4, R5, R6, left_gripper, right_gripper]
fps: 15
data_root: data
output_dir: outputs/a2a_noise_openarm_hcx_dual_arm_sepenc_gaussian_2std

dataset:
  n_obs_steps: 8
  horizon: 16
  run_name: openarm_hcx_dual_arm
  pre_crop_size: 720
  resize_size: 512
  crop_size: null
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  color_jitter_saturation: 0.1
  color_jitter_hue: 0.02
  # gaussian | gaussian_2std | limits([-1,1]) | limits_01([0,1])
  norm_mode: gaussian_2std
  uint8_cache: true
  gpu_augment: true

policy:
  type: a2a
  hidden_dim: 256
  num_inference_steps: 6
  n_action_steps: 16
  pretrained_encoder: true
  use_frame_diff: true
  # false: head / left_hand / right_hand 各一套 ResNet 权重（约 3× 视觉参数）
  share_image_encoder: false
  latent_dim: 512
  consistency_weight: 1.0
  enc_recon_weight: 0.5
  flow_recon_weight: 0.5
  history_noise_std: 0.15
  flow_hidden_dim: 512
  flow_num_layers: 4
  flow_mlp_ratio: 4.0
  ae_enc_hidden_dim: 512
  ae_dec_hidden_dim: 512
  ae_num_layers: 4
  rtc:
    # RTC 推理引导（训练不受影响）；A2A 要求 n_action_steps == horizon
    enabled: false
    execution_horizon: 8
    max_guidance_weight: 10.0
    prefix_attention_schedule: exp
    inference_delay: 2
    debug: false

train:
  # 16GB VRAM + 512/sepenc → bs=16；workers=2；每 4 epoch 存盘（24684）
  batch_size: 32
  steps: 246840
  lr: 0.0005
  weight_decay: 0.000001
  log_freq: 10
  save_freq: 24684
  device: cuda
  num_workers: 2
  cosine_lr: true
  warmup_steps: 500
  encoder_lr_scale: 0.1
  max_grad_norm: 1.0
